<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>서연아, 생일 축하해</title>
  <meta name="description" content="서연이의 8번째 생일을 위한 작은 선물">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 배경에 떠다니는 작은 하트 -->
  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

  <!-- 시작 화면: 하트를 누르면 노래와 함께 시작 -->
  <div class="start-overlay" id="startOverlay">
    <p class="start-title">서연이에게 온 선물</p>
    <button class="start-heart-btn" id="startBtn" type="button" aria-label="하트를 눌러 선물 열기">
      <svg class="start-heart-svg" viewBox="0 0 100 92" aria-hidden="true">
        <defs>
          <radialGradient id="heartGrad" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#ffb3d6"/>
            <stop offset="55%" stop-color="#ff5b8d"/>
            <stop offset="100%" stop-color="#e0003a"/>
          </radialGradient>
        </defs>
        <path d="M50 88 C20 66 2 50 2 29 C2 14 13 3 27 3 C37 3 45 9 50 17 C55 9 63 3 73 3 C87 3 98 14 98 29 C98 50 80 66 50 88 Z" fill="url(#heartGrad)"/>
        <ellipse cx="33" cy="24" rx="9" ry="5" fill="rgba(255,255,255,0.35)" transform="rotate(-30 33 24)"/>
      </svg>
      <span class="start-heart-label">눌러줘</span>
    </button>
    <p class="start-hint">하트를 누르면 선물이 열려요 🎁</p>
  </div>

  <!-- 1페이지: 하트 -->
  <section class="page page-heart is-active" id="pageHeart">
    <div class="heart-stage" id="heartStage" aria-label="여러 나라 말로 쓴 사랑해로 만든 하트"></div>
    <h1 class="birthday-text" id="birthdayText">
      <span>서연아</span> <span>8번째</span> <span>생일</span> <span>축하해</span> <span class="cake">🎂</span>
    </h1>
  </section>

  <!-- 2페이지: 편지 봉투와 편지지 -->
  <section class="page page-letter" id="pageLetter">
    <div class="letter-scene" id="letterScene">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="letter-paper" id="letterPaper">
          <div class="paper-lines"></div>
          <div class="letter-body" id="letterBody"></div>
          <span class="pen" id="pen" aria-hidden="true">🖊️</span>
        </div>
        <div class="envelope-side"></div>
        <div class="envelope-front"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-seal">♥</div>
      </div>
    </div>
  </section>

  <!-- 페이지 이동 버튼 -->
  <nav class="nav" id="nav" hidden>
    <button class="nav-btn" id="toLetterBtn" type="button">편지 보기 →</button>
    <button class="nav-btn" id="toHeartBtn" type="button" hidden>← 하트 보기</button>
  </nav>

  <!-- 소리: 버튼을 누르면 음량 조절 막대가 나옵니다 -->
  <div class="sound" id="sound" hidden>
    <button class="sound-btn" id="soundBtn" type="button" aria-label="음량 조절 열기">🔊</button>
    <div class="volume-panel" id="volumePanel" hidden>
      <button class="mute-btn" id="muteBtn" type="button" aria-label="소리 끄기">🔇</button>
      <input class="volume-slider" id="volumeSlider" type="range" min="0" max="100" step="1" value="70" aria-label="음량">
      <span class="volume-value" id="volumeValue">70</span>
    </div>
  </div>

  <audio id="bgm" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
